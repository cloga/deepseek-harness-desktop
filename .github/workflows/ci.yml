name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, v0.11.0]

permissions:
  contents: read
  # skip-duplicate-actions 要查询 Workflow Runs API（actions 作用域），
  # 缺它会 403/超时；仅 contents: read 会被 GitHub 解释为无 actions 权限。
  actions: read

# 同一分支/PR 的新提交会取消上次仍在运行的 CI，避免浪费 runner 时间。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # doc 下的 debug 符号只会膨胀 target 目录、降低缓存命中率，测试不需要。
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # 门卫：内容哈希相同且已成功通过（或同一内容正在运行）时跳过，避免重复跑。
  # push main 与 pull_request main 常常是同一个内容，用 skip_after_successful_duplicate
  # 加 concurrent_skipping: same_content 精确去重；手动触发/schedule 永不跳过。
  pre_job:
    name: Pre-job (Skip Duplicate Actions)
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          concurrent_skipping: same_content
          skip_after_successful_duplicate: true
          paths_ignore: '["**/docs/**", "**/*.md"]'

  # 前端（vitest + typecheck + lint）：
  frontend:
    name: Frontend (vitest + typecheck + lint)
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      # 主逻辑在 Rust 侧，这里仅确认前端纯函数测试通过
      - name: Unit test
        run: pnpm run test -- --run

  # Rust 单元测试（应用主体逻辑）：
  # 这是 CI 此前完全缺失的部分。仓库里存在大量 #[cfg(windows)] 的 Windows 专属
  # 代码（win_spawn / win_inspector / cli shim / path / MSI 版本处理），只能在
  # Rust 单元测试（应用主体逻辑）：
  # 这是 CI 此前完全缺失的部分。仓库存在大量平台专属代码，必须在对应 OS 上编译并测试：
  #   - #[cfg(windows)]：win_spawn / win_inspector / cli shim / path / MSI 版本处理 → Windows
  #   - #[cfg(target_os = "macos")]：homebrew Node 路径 & macOS 包名/资产名 → macOS
  #   - Unix/Linux cfg 分支 → ubuntu
  # 与官方 tauri-apps/tauri 的 test-core 矩阵一致：ubuntu + macos + windows，
  # "更广泛"地覆盖应用实际发布的三个平台，而不是像前端那样按 Node 版本重复。
  rust-test:
    name: Rust tests
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # Linux 用与 release workflow 相同的 ubuntu-22.04 + 同一套 apt 包，
        # 保证首次跑 CI 就能编译（tauri 的 webkit/appindicator 原生依赖对齐已知可用环境）。
        # macOS 用官方矩阵的 macos-14（Apple Silicon）。
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Run tests
        run: cargo test --all-features --locked
        working-directory: src-tauri

      - name: Packaged WebView authentication probe
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum cargo run --locked --example auth_webview_probe
        working-directory: src-tauri

      - name: Packaged WebView authentication probe
        if: runner.os == 'macOS'
        run: cargo run --locked --example auth_webview_probe
        working-directory: src-tauri

  native-webview-e2e:
    name: Windows native WebView E2E
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: windows-latest
    env:
      DSH_CLI_PATH: ${{ github.workspace }}\test\e2e\local-core\dsh.cmd
      DSH_E2E_APPLICATION: ${{ github.workspace }}\src-tauri\target\debug\deepseek-harness-desktop.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WebDriver-enabled desktop app
        run: pnpm exec tauri build --debug --no-bundle

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install matching WebView2 driver
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME\.cargo\bin\msedgedriver-tool.exe"
          $PWD.Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare isolated desktop state
        shell: pwsh
        run: |
          $appData = Join-Path $env:APPDATA 'io.github.hairyf.deepseek-harness-desktop\dev'
          $managed = Join-Path $appData 'dependencies\dsh\node_modules\@deepseek-ai\dsh'
          $dshHome = Join-Path $env:USERPROFILE '.dsh.dev'
          New-Item -ItemType Directory -Force -Path (Join-Path $managed 'lib') | Out-Null
          Copy-Item test\e2e\store.dat (Join-Path $appData '.store.dev.dat')
          Copy-Item test\e2e\local-core\node_modules\@deepseek-ai\dsh\package.json $managed
          Copy-Item test\e2e\local-core\node_modules\@deepseek-ai\dsh\lib\bin.js (Join-Path $managed 'lib\bin.js')
          New-Item -ItemType Directory -Force -Path $dshHome | Out-Null

      - name: Run fresh native WebView flow
        shell: pwsh
        run: |
          $edgeDriver = Get-Command msedgedriver.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty Source
          if (-not $edgeDriver) {
            $edgeDriver = Get-ChildItem C:\SeleniumWebDrivers -Recurse -Filter msedgedriver.exe |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $edgeDriver) {
            throw 'msedgedriver.exe is not available on the Windows runner'
          }
          $edgeVersion = (Get-Item $edgeDriver).VersionInfo.FileVersion
          $webViewVersion = Get-ItemPropertyValue `
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F1E7EFC4-4D73-4C4C-8F5D-C36C7D1A5A70}' `
            -Name pv -ErrorAction SilentlyContinue
          Write-Host "EdgeDriver: $edgeDriver ($edgeVersion)"
          Write-Host "WebView2 runtime: $webViewVersion"

          function Write-SanitizedLog([string] $Path) {
            if (-not (Test-Path $Path)) {
              return
            }
            Write-Host "::group::$Path"
            Get-Content $Path -ErrorAction SilentlyContinue |
              ForEach-Object {
                $_ `
                  -replace '(?i)([?&](?:token|desktopToken)=)[^&\s"]+', '$1[REDACTED]' `
                  -replace '(?i)(Authorization:\s*(?:Bearer\s+)?)[^\s"]+', '$1[REDACTED]' `
                  -replace '(?i)(Cookie:\s*)[^\r\n]+', '$1[REDACTED]'
              } |
              Select-Object -Last 500
            Write-Host '::endgroup::'
          }

          $driverOut = Join-Path $env:RUNNER_TEMP 'tauri-driver.stdout.log'
          $driverErr = Join-Path $env:RUNNER_TEMP 'tauri-driver.stderr.log'
          $driver = Start-Process tauri-driver -ArgumentList '--native-driver', $edgeDriver -PassThru `
            -RedirectStandardOutput $driverOut -RedirectStandardError $driverErr
          $testExitCode = 0
          try {
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if (Test-NetConnection 127.0.0.1 -Port 4444 -InformationLevel Quiet -WarningAction SilentlyContinue) {
                break
              }
              Start-Sleep -Milliseconds 250
            }
            pnpm run test:e2e:native
            $testExitCode = $LASTEXITCODE
          }
          catch {
            Write-Host "::error::$($_.Exception.Message)"
            $testExitCode = 1
          }
          finally {
            $appProcesses = Get-CimInstance Win32_Process |
              Where-Object { $_.ExecutablePath -eq $env:DSH_E2E_APPLICATION }
            if ($appProcesses) {
              $appProcesses |
                Select-Object ProcessId, ParentProcessId, CreationDate, ExecutablePath |
                Format-List
            }
            else {
              Write-Host 'Desktop process is not running after the session failure.'
            }

            if (-not $driver.HasExited) {
              Stop-Process -Id $driver.Id -ErrorAction SilentlyContinue
              $driver.WaitForExit(10000)
            }
            Write-SanitizedLog $driverOut
            Write-SanitizedLog $driverErr

            $desktopData = Join-Path $env:APPDATA 'io.github.hairyf.deepseek-harness-desktop'
            @(
              (Join-Path $desktopData 'logs\desktop.log'),
              (Join-Path $desktopData 'logs\desktop.frontdesk.log'),
              (Join-Path $desktopData 'dev\logs\desktop.log'),
              (Join-Path $desktopData 'dev\logs\desktop.frontdesk.log'),
              (Join-Path $desktopData 'dev\logs\dsh-web.dev.log')
            ) | ForEach-Object { Write-SanitizedLog $_ }
          }
          if ($testExitCode -ne 0) {
            exit $testExitCode
          }
