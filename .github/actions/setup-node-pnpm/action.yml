name: Setup Node.js and pnpm
description: Install the repository pnpm version and configure Node.js caching

inputs:
  node-version:
    description: Node.js version passed to actions/setup-node
    required: false
    default: '22'
  cache-dependency-path:
    description: Dependency lockfile used for the pnpm cache key
    required: false
    default: pnpm-lock.yaml

runs:
  using: composite
  steps:
    # package.json 的 packageManager 字段提供精确 pnpm 版本。
    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    # prepare 等不安装依赖的 job 也会执行 setup-node 的 post cache，预先创建 store
    # 避免手动测试构建因缓存路径不存在而失败。
    - name: Ensure pnpm store exists
      shell: bash
      run: mkdir -p "$(pnpm store path --silent)"
